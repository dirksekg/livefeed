<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }

  iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
    background: #000;
  }

  body.lock-player iframe {
    pointer-events: none;
  }

  #debugPanel {
    display: none;
    position: fixed;
    z-index: 2;
    right: 12px;
    bottom: 12px;
    box-sizing: border-box;
    width: min(560px, calc(100vw - 24px));
    max-height: min(520px, calc(100vh - 24px));
    overflow: auto;
    padding: 12px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.82);
    color: #d7f7d7;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    cursor: auto;
  }

  body.debug {
    cursor: auto;
  }

  body.debug #debugPanel {
    display: block;
  }
</style>
</head>

<body class="lock-player">
  <iframe
    id="player"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <pre id="debugPanel" aria-live="polite"></pre>

  <script>
    const DEFAULT_YOUTUBE_URL = 'https://www.youtube.com/watch?v=IVmL3diwJuw';
    const LOCK_PLAYER_INTERACTION = true;

    const params = new URLSearchParams(window.location.search);
    const DEBUG = params.get('debug') === '1';

    if (!LOCK_PLAYER_INTERACTION || DEBUG) {
      document.body.classList.remove('lock-player');
    }

    if (DEBUG) {
      document.body.classList.add('debug');
    }

    function debugLog(label, value) {
      if (!DEBUG) return;

      const panel = document.getElementById('debugPanel');
      const time = new Date().toLocaleTimeString();
      const detail = value === undefined ? '' : '\n' + formatDebugValue(value);
      panel.textContent += '[' + time + '] ' + label + detail + '\n\n';
      panel.scrollTop = panel.scrollHeight;
      console.log('[live-feed] ' + label, value);
    }

    function formatDebugValue(value) {
      if (typeof value === 'string') return value;

      try {
        return JSON.stringify(value, null, 2);
      } catch (error) {
        return String(value);
      }
    }

    function extractYouTubeId(url) {
      if (!url) return '';

      const text = String(url).trim();

      if (/^[a-zA-Z0-9_-]{11}$/.test(text)) {
        return text;
      }

      let match = text.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      match = text.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      match = text.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      match = text.match(/youtube\.com\/live\/([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      match = text.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      return '';
    }

    function getRequestedFeed() {
      return params.get('v') ||
        params.get('video') ||
        params.get('youtube') ||
        params.get('url') ||
        DEFAULT_YOUTUBE_URL;
    }

    function buildEmbedUrl() {
      const requestedFeed = getRequestedFeed();
      const requestedVideoId = extractYouTubeId(requestedFeed);
      const fallbackVideoId = extractYouTubeId(DEFAULT_YOUTUBE_URL);
      const videoId = requestedVideoId || fallbackVideoId;
      const embedUrl = 'https://www.youtube.com/embed/' + videoId +
        '?autoplay=1&mute=1&playsinline=1&controls=0&rel=0&disablekb=1&fs=0&modestbranding=1&iv_load_policy=3';

      debugLog('buildEmbedUrl', {
        requestedFeed: requestedFeed,
        requestedVideoId: requestedVideoId,
        fallbackUsed: !requestedVideoId,
        embedUrl: embedUrl
      });

      return embedUrl;
    }

    document.getElementById('player').src = buildEmbedUrl();
  </script>
</body>
</html>
