<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Feed Debug</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 24px;
  }

  .box {
    background: #222;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  iframe {
    width: 640px;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    background: #000;
  }

  code {
    display: block;
    white-space: pre-wrap;
    word-break: break-word;
    background: #000;
    color: #0f0;
    padding: 12px;
    border-radius: 8px;
  }

  .bad { color: #ff8a8a; }
  .ok { color: #80ff9f; }
</style>
</head>

<body>
  <h1>Live Feed Debug</h1>

  <div class="box">
    <strong>Status:</strong>
    <div id="status">Starting...</div>
  </div>

  <div class="box">
    <strong>Values read from Google Sheet:</strong>
    <code id="values">Waiting...</code>
  </div>

  <div class="box">
    <strong>Generated embed URL:</strong>
    <code id="embedUrl">Waiting...</code>
  </div>

  <div class="box">
    <strong>Google Sheet request URL:</strong>
    <code id="requestUrl">Waiting...</code>
  </div>

  <div class="box">
    <strong>Preview:</strong><br><br>
    <iframe
      id="player"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <script>
    const SHEET_ID = '1v_SzMbu0igfZeqW_SwpTjGtai4dvJ6WRkRG-qxlwbTo';
    const SHEET_NAME = 'Settings';
    const DEFAULT_YOUTUBE_URL = 'https://www.youtube.com/watch?v=IVmL3diwJuw';

    function setStatus(message, good) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = good ? 'ok' : 'bad';
    }

    function extractYouTubeId(url) {
      if (!url) return '';

      const text = String(url).trim();

      if (/^[a-zA-Z0-9_-]{11}$/.test(text)) {
        return text;
      }

      let match = text.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      match = text.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      match = text.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      match = text.match(/youtube\.com\/live\/([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];

      return '';
    }

    function buildEmbedUrl(rawUrl) {
      const videoId = extractYouTubeId(rawUrl) || extractYouTubeId(DEFAULT_YOUTUBE_URL);

      return 'https://www.youtube.com/embed/' + videoId +
        '?autoplay=1&mute=1&playsinline=1&controls=0&rel=0&disablekb=1&fs=0&modestbranding=1&iv_load_policy=3';
    }

    function getCellValue(cell) {
      if (!cell) return '';
      if (cell.f !== undefined) return String(cell.f).trim();
      if (cell.v !== undefined) return String(cell.v).trim();
      return '';
    }

    function parseSheetResponse(response) {
      const settings = {};

      if (!response || !response.table || !response.table.rows) {
        return settings;
      }

      response.table.rows.forEach(function(row) {
        const cells = row.c || [];
        const key = getCellValue(cells[0]);
        const value = getCellValue(cells[1]);

        if (key && key !== 'Setting') {
          settings[key] = value;
        }
      });

      return settings;
    }

    function loadSettings() {
      const callbackName = 'liveFeedDebugCallback_' + Date.now();
      let script;

      window[callbackName] = function(response) {
        try {
          const settings = parseSheetResponse(response);
          const newUrl = settings.YouTubeURL || DEFAULT_YOUTUBE_URL;
          const version = settings.Version || '0';
          const embedUrl = buildEmbedUrl(newUrl);

          document.getElementById('values').textContent =
            'YouTubeURL: ' + newUrl + '\nVersion: ' + version;

          document.getElementById('embedUrl').textContent = embedUrl;
          document.getElementById('player').src = embedUrl;

          if (settings.YouTubeURL) {
            setStatus('Successfully read Google Sheet.', true);
          } else {
            setStatus('Sheet loaded, but YouTubeURL was not found. Check spelling/cell layout.', false);
          }
        } catch (error) {
          setStatus('Error parsing sheet response: ' + error.message, false);
        } finally {
          delete window[callbackName];
          if (script && script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }
      };

      script = document.createElement('script');
      const cacheBust = Date.now();

      const requestUrl =
        'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(SHEET_ID) +
        '/gviz/tq?tqx=out:json;responseHandler:' + callbackName +
        '&sheet=' + encodeURIComponent(SHEET_NAME) +
        '&headers=0' +
        '&cachebust=' + cacheBust;

      document.getElementById('requestUrl').textContent = requestUrl;

      script.src = requestUrl;

      script.onerror = function() {
        setStatus('Could not load Google Sheet. Most likely sharing/publishing/access issue, or the tab name is wrong.', false);
        delete window[callbackName];
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      };

      document.body.appendChild(script);
    }

    loadSettings();
  </script>
</body>
</html>
